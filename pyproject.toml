[project]
name = "tensor"
version = "0.3.0"
description = "Консольное приложение: выборка сотрудников офиса по id сотрудника"
readme = "README.md"
authors = [
    { name = "Georgiy Kiselev", email = "gsx2002@yandex.ru" }
]
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
